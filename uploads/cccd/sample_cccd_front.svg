<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="25" y="20" width="450" height="40" fill="none"/>
  <text x="250" y="38" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</text>
  <text x="250" y="54" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">Độc lập - Tự do - Hạnh phúc</text>
  <text x="250" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">CĂN CƯỚC CÔNG DÂN</text>
  
  <!-- Avatar box -->
  <rect x="40" y="95" width="100" height="130" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>

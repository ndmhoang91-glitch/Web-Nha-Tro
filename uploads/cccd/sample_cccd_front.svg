  <!-- Info lines -->
  <text x="160" y="115" font-family="sans-serif" font-size="11" fill="#475569">Số / No.:</text>
  <text x="230" y="115" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a">0792 0100 4567</text>

  <text x="160" y="145" font-family="sans-serif" font-size="11" fill="#475569">Họ và tên / Full name:</text>
  <text x="160" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">TRẦN VĂN MINH</text>

  <text x="160" y="195" font-family="sans-serif" font-size="11" fill="#475569">Ngày sinh / Date of birth:</text>
  <text x="310" y="195" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">15/08/2001</text>

  <text x="160" y="220" font-family="sans-serif" font-size="11" fill="#475569">Giới tính / Sex:</text>
  <text x="250" y="220" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Nam</text>
  <text x="300" y="220" font-family="sans-serif" font-size="11" fill="#475569">Quốc tịch: <tspan font-weight="bold" fill="#0f172a">Việt Nam</tspan></text>

  <text x="160" y="245" font-family="sans-serif" font-size="11" fill="#475569">Quê quán / Place of origin:</text>
  <text x="160" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">TP. Tân An, Tỉnh Long An</text>

  <!-- Chip icon -->
  <rect x="400" y="115" width="50" height="40" rx="4" fill="#fbbf24" stroke="#d97706"/>
